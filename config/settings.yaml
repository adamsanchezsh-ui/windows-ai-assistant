app:
  name: "CYPHERpc"
  version: "0.2.0"
  language: "cs"
  theme: "dark"
  accent_color: "#7C3AED"

ai:
  default_mode: "normal"
  max_history: 50
  temperature: 0.7
  vision_mode: "on_demand"
  periodic_interval_sec: 30
  memory_enabled: false
  auto_model_select: true
  style: "normal"

performance:
  mode: "balanced"
  default_priority: "normal"

overlay:
  enabled: false
  monitor: 1
  opacity: 0.85

voice:
  enabled: false
  language: "cs"
  volume: 0.8
  rate: 1.0
  wake_word: false
  wake_word_phrase: "cypher"
  auto_detect_language: false

hotkeys:
  ai_toggle: "F8"
  overlay_toggle: "F9"
  voice_hints_toggle: "F10"
  push_to_talk: "F11"
  emergency_stop: "Ctrl+Shift+Esc"
  control_center: "Ctrl+Shift+C"

monitors:
  selected: 1
  max_supported: 4

security:
  confirm_delete: true
  confirm_system_change: true
  confirm_send_message: true
  use_defender: true
  quarantine_instead_of_delete: true

profile: "default"
privacy_mode: false
